<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Recipe</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Sans KR", Arial, sans-serif;
    background: #f7f8fa;
    color: #222;
}

/* =========================
   HEADER
========================= */

.header {
    height: 72px;
    background: #fff;
    border-bottom: 1px solid #eee;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    font-size: 29px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    color: #ff641e;
}

.logo-sub {
    margin-left: 12px;
    color: #777;
    font-size: 14px;
}

.header-menu {
    display: flex;
    gap: 28px;
    color: #555;
    font-size: 14px;
}


/* =========================
   MAIN
========================= */

.container {
    width: 1500px;
    max-width: calc(100% - 40px);

    margin: 24px auto;

    display: grid;
    grid-template-columns: 590px 1fr;
    gap: 18px;
}

.card {
    background: #fff;

    border: 1px solid #e5e5e5;
    border-radius: 16px;

    padding: 24px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.04);
}


/* =========================
   TITLE
========================= */

.title {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 20px;
    font-weight: 800;

    margin-bottom: 18px;
}

.count {
    background: #fff0e8;
    color: #ff641e;

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 13px;
}


/* =========================
   SEARCH
========================= */

.search {
    position: relative;
    margin-bottom: 14px;
}

.search input {
    width: 100%;
    height: 48px;

    border: 1px solid #ddd;
    border-radius: 10px;

    padding: 0 45px 0 15px;

    font-size: 14px;
    outline: none;
}

.search input:focus {
    border-color: #ff641e;
}

.search-icon {
    position: absolute;

    right: 15px;
    top: 12px;

    font-size: 20px;
}


/* =========================
   CATEGORY
========================= */

.categories {
    display: flex;
    gap: 8px;

    margin-bottom: 16px;

    flex-wrap: wrap;
}

.category {
    border: 1px solid #ddd;
    background: #fff;

    border-radius: 20px;

    padding: 8px 15px;

    font-size: 13px;

    cursor: pointer;
}

.category:hover {
    border-color: #ff641e;
}

.category.active {
    background: #ff641e;
    border-color: #ff641e;

    color: white;
    font-weight: 700;
}


/* =========================
   SELECTED
========================= */

.selected-box {
    border: 1px solid #e3e3e3;

    border-radius: 10px;

    padding: 14px;

    margin-bottom: 18px;
}

.selected-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;

    font-size: 14px;
    font-weight: 700;
}

.delete-btn {
    background: white;

    border: 1px solid #ddd;

    border-radius: 6px;

    padding: 6px 10px;

    cursor: pointer;

    font-size: 12px;
}

.delete-btn:hover {
    background: #f7f7f7;
}

.selected-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.selected-item {
    background: #fafafa;

    border: 1px solid #ddd;

    border-radius: 20px;

    padding: 7px 11px;

    font-size: 13px;

    cursor: pointer;
}

.selected-item:hover {
    border-color: #ff641e;
}


/* =========================
   INGREDIENT GRID
========================= */

.ingredient-grid {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 10px;
}

.ingredient {
    height: 90px;

    border: 1px solid #e1e1e1;

    border-radius: 10px;

    background: #fff;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    position: relative;

    transition: .15s;
}

.ingredient:hover {
    border-color: #ff641e;

    transform: translateY(-2px);

    box-shadow:
        0 4px 10px rgba(255,100,30,.08);
}

.ingredient.selected {
    border: 2px solid #ff641e;

    background: #fff8f4;
}

.ingredient-icon {
    font-size: 33px;

    margin-bottom: 5px;
}

.ingredient-name {
    font-size: 13px;

    font-weight: 600;
}

.check {
    position: absolute;

    right: 5px;
    top: 5px;

    width: 21px;
    height: 21px;

    border-radius: 50%;

    background: #ff641e;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;
}


/* =========================
   BUTTON
========================= */

.recommend-btn {
    width: 100%;

    height: 54px;

    margin-top: 20px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #ff641e,
            #ff7100
        );

    color: white;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.recommend-btn:hover {
    transform: translateY(-1px);
}

.recommend-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
}


/* =========================
   RIGHT
========================= */

.result-title {
    font-size: 20px;
    font-weight: 800;

    margin-bottom: 18px;
}

.recipe-header {
    display: grid;

    grid-template-columns:
        1fr 420px;

    gap: 20px;

    margin-bottom: 18px;
}

.recipe-name {
    font-size: 29px;

    font-weight: 900;

    margin-top: 25px;

    margin-bottom: 18px;
}

.recipe-icon {
    font-size: 40px;
}


/* =========================
   IMAGE
========================= */

.recipe-image {
    width: 100%;
    height: 250px;

    object-fit: cover;

    border-radius: 14px;

    background: #eee;
}


/* =========================
   SCORE
========================= */

.scores {
    display: flex;

    gap: 12px;
}

.score {
    padding: 13px 18px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 700;
}

.score strong {
    font-size: 20px;

    margin-left: 7px;
}

.score.orange {
    background: #fff4ed;

    border: 1px solid #ffd5c1;

    color: #e95719;
}

.score.green {
    background: #effaf3;

    border: 1px solid #c9ead4;

    color: #159447;
}


/* =========================
   STATUS
========================= */

.status {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 14px;

    margin: 15px 0;
}

.status-box {
    min-height: 105px;

    padding: 16px;

    border-radius: 12px;
}

.have {
    background: #f0fbf4;

    border: 1px solid #c9ecd5;
}

.missing {
    background: #fff5f5;

    border: 1px solid #ffd0d0;
}

.status-title {
    font-weight: 800;

    margin-bottom: 12px;
}

.have .status-title {
    color: #159447;
}

.missing .status-title {
    color: #df3030;
}

.tags {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.tag {
    background: white;

    border: 1px solid #ddd;

    padding: 7px 13px;

    border-radius: 20px;

    font-size: 13px;
}


/* =========================
   FINAL RECIPE
========================= */

.final-recipe {
    border: 1px solid #e1e1e1;

    border-radius: 12px;

    padding: 20px;
}

.final-title {
    font-size: 19px;

    font-weight: 800;

    margin-bottom: 18px;
}

.recipe-content {
    display: grid;

    grid-template-columns:
        250px 1fr;

    gap: 25px;
}


/* 재료 */

.ingredients h3,
.steps h3 {
    font-size: 15px;

    margin-bottom: 14px;
}

.ingredients ul {
    padding-left: 20px;

    margin: 0;
}

.ingredients li {
    margin-bottom: 10px;

    font-size: 14px;
}


/* 조리 방법 */

.steps {
    border-left: 1px solid #eee;

    padding-left: 25px;
}

.step {
    display: flex;

    gap: 10px;

    margin-bottom: 14px;

    font-size: 14px;

    line-height: 1.6;
}

.step-number {
    width: 23px;
    height: 23px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #13a04b;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;

    font-weight: bold;
}


/* =========================
   TIP
========================= */

.tip {
    margin-top: 20px;

    padding: 15px;

    background: #fffaf0;

    border: 1px solid #ffe5a8;

    border-radius: 10px;

    font-size: 13px;

    line-height: 1.6;
}

.tip-title {
    color: #8b6200;

    font-weight: 800;

    margin-bottom: 7px;
}


/* =========================
   SUBSTITUTION
========================= */

.substitution {
    margin-top: 14px;

    padding: 15px;

    background: #f4f8ff;

    border: 1px solid #d8e7ff;

    border-radius: 10px;
}

.substitution-title {
    color: #2772d3;

    font-weight: 800;

    margin-bottom: 10px;
}

.substitution li {
    font-size: 13px;

    margin-bottom: 7px;
}


/* =========================
   LOADING
========================= */

.loading {
    height: 500px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: #777;
}

.spinner {
    width: 45px;
    height: 45px;

    border: 4px solid #eee;

    border-top-color: #ff641e;

    border-radius: 50%;

    animation: spin 1s linear infinite;

    margin-bottom: 15px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

.error {
    margin-top: 15px;

    padding: 15px;

    background: #fff1f1;

    border: 1px solid #ffcaca;

    border-radius: 10px;

    color: #d33;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px) {

    .container {
        width: 95%;

        grid-template-columns: 1fr;
    }

    .recipe-header {
        grid-template-columns: 1fr;
    }

}

@media(max-width:700px) {

    .container {
        max-width: calc(100% - 20px);
    }

    .ingredient-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .status {
        grid-template-columns: 1fr;
    }

    .recipe-content {
        grid-template-columns: 1fr;
    }

    .steps {
        border-left: none;

        border-top: 1px solid #eee;

        padding-left: 0;

        padding-top: 20px;
    }

    .header-menu {
        display: none;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo-area">

        <div class="logo-icon">
            👨‍🍳
        </div>

        <div class="logo">
            AI Recipe
        </div>

        <div class="logo-sub">
            냉장고 속 재료로 오늘 뭐 먹지?
        </div>

    </div>


    <div class="header-menu">

        <span>🧊 나의 냉장고</span>

        <span>🕘 최근 추천</span>

        <span>⚙️ 설정</span>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


<!-- =====================================================
     LEFT : 재료 선택
===================================================== -->

<section class="card">


    <div class="title">

        <span>
            1. 냉장고 재료를 선택하세요
        </span>

        <span
            class="count"
            id="selectedCount">

            0개 선택

        </span>

    </div>


    <!-- 검색 -->

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="재료를 검색하세요 (예: 김치, 돼지고기)">

        <span class="search-icon">
            🔍
        </span>

    </div>


    <!-- 카테고리 -->

    <div
        class="categories"
        id="categories">

        <button
            class="category active"
            data-category="전체">

            전체

        </button>

        <button
            class="category"
            data-category="육류">

            육류

        </button>

        <button
            class="category"
            data-category="채소">

            채소

        </button>

        <button
            class="category"
            data-category="계란/유제품">

            계란/유제품

        </button>

        <button
            class="category"
            data-category="곡류">

            곡류

        </button>

        <button
            class="category"
            data-category="양념">

            양념

        </button>

        <button
            class="category"
            data-category="수산물">

            수산물

        </button>

    </div>


    <!-- 선택된 재료 -->

    <div class="selected-box">

        <div class="selected-header">

            <span>
                선택한 재료
            </span>

            <button
                class="delete-btn"
                id="deleteAll">

                🗑 전체 삭제

            </button>

        </div>


        <div
            class="selected-list"
            id="selectedList">

            <span
                style="
                color:#999;
                font-size:13px;
                ">

                재료를 선택해주세요.

            </span>

        </div>

    </div>


    <!-- 재료 GRID -->

    <div
        class="ingredient-grid"
        id="ingredientGrid">

    </div>


    <!-- 추천 -->

    <button
        class="recommend-btn"
        id="recommendBtn">

        🤖 AI 레시피 추천받기

    </button>


    <!-- 에러 -->

    <div
        class="error"
        id="errorBox"
        style="display:none;">

    </div>


</section>



<!-- =====================================================
     RIGHT : 결과
===================================================== -->

<section class="card">


    <div class="result-title">

        2. AI 레시피 추천 결과 ✨

    </div>


    <!-- 최초 화면 -->

    <div
        id="emptyResult"
        class="loading">

        <div style="font-size:70px;">
            🍳
        </div>

        <h2>
            냉장고 재료를 선택해주세요
        </h2>

        <p>
            재료를 선택하면 AI가 가장 적합한
            레시피를 추천합니다.
        </p>

    </div>


    <!-- Loading -->

    <div
        id="loading"
        class="loading"
        style="display:none;">

        <div class="spinner"></div>

        <h3>
            AI가 레시피를 찾고 있습니다.
        </h3>

        <p>
            PGVector 검색 → 재료 분석 → Gemini 레시피 생성
        </p>

    </div>


    <!-- 실제 결과 -->

    <div
        id="result"
        style="display:none;">

    </div>


</section>

</main>



<script>

/* =====================================================
   재료 데이터
===================================================== */

const ingredients = [

    {
        name:"돼지고기",
        icon:"🥩",
        category:"육류"
    },

    {
        name:"소고기",
        icon:"🥩",
        category:"육류"
    },

    {
        name:"닭고기",
        icon:"🍗",
        category:"육류"
    },

    {
        name:"김치",
        icon:"🥬",
        category:"채소"
    },

    {
        name:"대파",
        icon:"🌱",
        category:"채소"
    },

    {
        name:"양파",
        icon:"🧅",
        category:"채소"
    },

    {
        name:"감자",
        icon:"🥔",
        category:"채소"
    },

    {
        name:"당근",
        icon:"🥕",
        category:"채소"
    },

    {
        name:"마늘",
        icon:"🧄",
        category:"채소"
    },

    {
        name:"계란",
        icon:"🥚",
        category:"계란/유제품"
    },

    {
        name:"두부",
        icon:"🧊",
        category:"계란/유제품"
    },

    {
        name:"우유",
        icon:"🥛",
        category:"계란/유제품"
    },

    {
        name:"치즈",
        icon:"🧀",
        category:"계란/유제품"
    },

    {
        name:"쌀",
        icon:"🍚",
        category:"곡류"
    },

    {
        name:"밀가루",
        icon:"🌾",
        category:"곡류"
    },

    {
        name:"라면",
        icon:"🍜",
        category:"곡류"
    },

    {
        name:"고춧가루",
        icon:"🌶️",
        category:"양념"
    },

    {
        name:"고추장",
        icon:"🫙",
        category:"양념"
    },

    {
        name:"된장",
        icon:"🫙",
        category:"양념"
    },

    {
        name:"간장",
        icon:"🍶",
        category:"양념"
    },

    {
        name:"소금",
        icon:"🧂",
        category:"양념"
    },

    {
        name:"참치",
        icon:"🐟",
        category:"수산물"
    },

    {
        name:"고등어",
        icon:"🐟",
        category:"수산물"
    },

    {
        name:"새우",
        icon:"🦐",
        category:"수산물"
    }

];


/* =====================================================
   상태
===================================================== */

let selectedIngredients = [];

let currentCategory = "전체";


/* =====================================================
   DOM
===================================================== */

const ingredientGrid =
    document.getElementById(
        "ingredientGrid"
    );

const selectedList =
    document.getElementById(
        "selectedList"
    );

const selectedCount =
    document.getElementById(
        "selectedCount"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const deleteAll =
    document.getElementById(
        "deleteAll"
    );

const recommendBtn =
    document.getElementById(
        "recommendBtn"
    );

const emptyResult =
    document.getElementById(
        "emptyResult"
    );

const loading =
    document.getElementById(
        "loading"
    );

const result =
    document.getElementById(
        "result"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


/* =====================================================
   재료 화면 출력
===================================================== */

function renderIngredients() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    ingredientGrid.innerHTML = "";


    const filtered =
        ingredients.filter(item => {

            const categoryMatch =
                currentCategory === "전체"
                ||
                item.category === currentCategory;


            const searchMatch =
                item.name
                    .toLowerCase()
                    .includes(keyword);


            return categoryMatch &&
                   searchMatch;

        });


    filtered.forEach(item => {

        const div =
            document.createElement("div");


        div.className = "ingredient";


        if (
            selectedIngredients
                .includes(item.name)
        ) {

            div.classList.add(
                "selected"
            );

        }


        div.innerHTML = `

            <div class="ingredient-icon">
                ${item.icon}
            </div>

            <div class="ingredient-name">
                ${item.name}
            </div>

            ${
                selectedIngredients.includes(item.name)
                ?
                `
                <div class="check">
                    ✓
                </div>
                `
                :
                ""
            }

        `;


        /* 클릭 */

        div.addEventListener(
            "click",
            function() {

                toggleIngredient(
                    item
                );

            }
        );


        ingredientGrid.appendChild(
            div
        );

    });

}


/* =====================================================
   재료 선택 / 해제
===================================================== */

function toggleIngredient(item) {

    const index =
        selectedIngredients
            .indexOf(item.name);


    if (index >= 0) {

        /* 이미 선택 → 제거 */

        selectedIngredients.splice(
            index,
            1
        );

    } else {

        /* 선택 */

        selectedIngredients.push(
            item.name
        );

    }


    renderSelected();

    renderIngredients();

}


/* =====================================================
   선택된 재료 출력
===================================================== */

function renderSelected() {

    selectedCount.innerText =
        selectedIngredients.length
        + "개 선택";


    selectedList.innerHTML = "";


    if (
        selectedIngredients.length === 0
    ) {

        selectedList.innerHTML = `

            <span
                style="
                color:#999;
                font-size:13px;
                ">

                재료를 선택해주세요.

            </span>

        `;

        return;

    }


    selectedIngredients.forEach(
        name => {

            const item =
                ingredients.find(
                    x => x.name === name
                );


            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "selected-item";


            span.innerHTML =
                `${item.icon} ${item.name} ×`;


            span.addEventListener(
                "click",
                function() {

                    toggleIngredient(
                        item
                    );

                }
            );


            selectedList.appendChild(
                span
            );

        }
    );

}


/* =====================================================
   전체 삭제
===================================================== */

deleteAll.addEventListener(
    "click",
    function() {

        selectedIngredients = [];

        renderSelected();

        renderIngredients();

    }
);


/* =====================================================
   검색
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        renderIngredients();

    }
);


/* =====================================================
   카테고리
===================================================== */

document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(
                        ".category"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                this.classList.add(
                    "active"
                );


                currentCategory =
                    this.dataset.category;


                renderIngredients();

            }
        );

    });


/* =====================================================
   AI 추천
===================================================== */

recommendBtn.addEventListener(
    "click",
    async function() {


        if (
            selectedIngredients.length === 0
        ) {

            alert(
                "냉장고 재료를 하나 이상 선택해주세요."
            );

            return;

        }


        errorBox.style.display =
            "none";

        emptyResult.style.display =
            "none";

        result.style.display =
            "none";

        loading.style.display =
            "flex";


        recommendBtn.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/recipe/recommend",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            ingredients:
                                selectedIngredients,

                            topK: 5

                        })

                    }
                );


            if (!response.ok) {

                const message =
                    await response.text();

                throw new Error(
                    message ||
                    "레시피 추천에 실패했습니다."
                );

            }


            const data =
                await response.json();


            renderResult(data);


        }
        catch(error) {

            console.error(error);

            errorBox.innerText =
                error.message;


            errorBox.style.display =
                "block";


            emptyResult.style.display =
                "flex";

        }
        finally {

            loading.style.display =
                "none";

            recommendBtn.disabled =
                false;

        }

    }
);


/* =====================================================
   결과 출력
===================================================== */

function renderResult(data) {

    const finalRecipe =
        data.finalRecipe || {};


    const available =
        data.availableIngredients || [];


    const missing =
        data.missingIngredients || [];


    const ingredients =
        finalRecipe.ingredients || [];


    const steps =
        finalRecipe.steps || [];


    const substitutions =
        finalRecipe.substitutions || [];


    result.innerHTML = `

        <!-- 레시피 HEADER -->

        <div class="recipe-header">


            <div>

                <div class="recipe-name">

                    <span class="recipe-icon">
                        🍲
                    </span>

                    ${
                        finalRecipe.title
                        ||
                        data.recipeName
                        ||
                        "추천 레시피"
                    }

                </div>


                ${
                    finalRecipe.description
                    ?
                    `
                    <div
                        style="
                        color:#666;
                        line-height:1.6;
                        font-size:14px;
                        margin-bottom:18px;
                        ">

                        ${finalRecipe.description}

                    </div>
                    `
                    :
                    ""
                }


                <div class="scores">

                    <div class="score orange">

                        PGVector 유사도

                        <strong>

                            ${formatPercent(
                                data.similarity
                            )}

                        </strong>

                    </div>


                    <div class="score green">

                        재료 충족률

                        <strong>

                            ${formatPercent(
                                data.matchRate
                            )}

                        </strong>

                    </div>

                </div>

            </div>


            <!-- 이미지 -->

            <img
                class="recipe-image"

                src="${
                    data.imageUrl
                    ||
                    "/images/recipe-default.jpg"
                }"

                alt="${
                    data.recipeName || "레시피"
                }"

                onerror="
                    this.src =
                    '/images/recipe-default.jpg'
                ">

        </div>



        <!-- 재료 상태 -->

        <div class="status">


            <div class="status-box have">

                <div class="status-title">

                    ✅ 가지고 있는 재료

                </div>


                <div class="tags">

                    ${
                        available
                        .map(item =>
                            `
                            <span class="tag">
                                ${item}
                            </span>
                            `
                        )
                        .join("")
                    }

                </div>

            </div>



            <div class="status-box missing">

                <div class="status-title">

                    ❌ 부족한 재료

                </div>


                <div class="tags">

                    ${
                        missing.length > 0
                        ?
                        missing
                            .map(item =>
                                `
                                <span class="tag">
                                    ${item}
                                </span>
                                `
                            )
                            .join("")
                        :
                        `
                        <span
                            class="tag"
                            style="color:#159447">

                            모든 주요 재료가 있습니다.

                        </span>
                        `
                    }

                </div>

            </div>


        </div>



        <!-- 최종 레시피 -->

        <div class="final-recipe">


            <div class="final-title">

                👨‍🍳 최종 레시피

            </div>


            <div class="recipe-content">


                <!-- 재료 -->

                <div class="ingredients">

                    <h3>
                        🛒 재료
                    </h3>


                    <ul>

                        ${
                            ingredients
                            .map(item =>
                                `
                                <li>
                                    ${item}
                                </li>
                                `
                            )
                            .join("")
                        }

                    </ul>

                </div>



                <!-- 조리 방법 -->

                <div class="steps">

                    <h3>
                        👩‍🍳 조리 방법
                    </h3>


                    ${
                        steps
                        .map(
                            (step,index) =>
                            `
                            <div class="step">

                                <span
                                    class="step-number">

                                    ${index + 1}

                                </span>

                                <span>
                                    ${step}
                                </span>

                            </div>
                            `
                        )
                        .join("")
                    }

                </div>

            </div>



            <!-- TIP -->

            ${
                finalRecipe.tip
                ?
                `
                <div class="tip">

                    <div class="tip-title">

                        💡 AI 추천 TIP

                    </div>

                    ${finalRecipe.tip}

                </div>
                `
                :
                ""
            }



            <!-- 대체재료 -->

            ${
                substitutions.length > 0
                ?
                `
                <div class="substitution">

                    <div class="substitution-title">

                        🔄 대체 가능한 재료

                    </div>

                    <ul>

                        ${
                            substitutions
                            .map(item =>
                                `
                                <li>
                                    ${item}
                                </li>
                                `
                            )
                            .join("")
                        }

                    </ul>

                </div>
                `
                :
                ""
            }


        </div>

    `;


    result.style.display =
        "block";

}


/* =====================================================
   % 변환
===================================================== */

function formatPercent(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "0%";

    }


    const number =
        Number(value);


    if (number <= 1) {

        return (
            number * 100
        ).toFixed(1) + "%";

    }


    return number.toFixed(1) + "%";

}


/* =====================================================
   최초 실행
===================================================== */

renderIngredients();

renderSelected();

</script>
